[package]
name = "milimo-video"
version = "0.1.0"
description = "Milimo Video local AI film studio"
authors = ["Milimo"]
edition = "2021"

[lib]
name = "milimo_video_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
